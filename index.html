<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생활 계산기</title>
<meta name="description" content="육아휴직 급여처럼 헷갈리는 생활 속 금액을 바로 계산해 주는 무료 계산기 모음입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f6f4; --surface: #ffffff; --ink: #17302b; --muted: #5b6f6a;
  --line: #d5dfdb; --accent: #0f6e5c;
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101816; --surface: #18231f; --ink: #e6efec; --muted: #9db0aa;
    --line: #2c3b36; --accent: #5cc7ae; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
main { max-width: 640px; margin: 0 auto; padding: 28px 16px 56px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.25; margin: 0; }
p { margin: 0; }
.lede { color: var(--muted); font-size: 15px; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; text-decoration: none; color: inherit; }
.item:hover, .item:focus-visible { border-color: var(--accent); outline: none; }
.item strong { display: block; font-size: 17px; font-weight: 600; color: var(--accent); }
.item span { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>생활 계산기</h1>
    <p class="lede">헷갈리는 생활 속 금액을 바로 계산해 드립니다. 가입 없이 무료로 쓸 수 있습니다.</p>
  </header>
  <ul>
    <li>
      <a class="item" href="parental-leave/">
        <strong>육아휴직 급여 계산기</strong>
        <span>2026년 기준. 일반, 6+6 부모육아휴직제, 한부모 월별 금액과 총액</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
